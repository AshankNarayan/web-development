<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Complex Form</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
        <label for="Name">Name:</label>
        <input type="text" id="Name">

        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="phone">Phone:</label>
        <input type="tel" id="phone">

        <label for="DOB">Date Of Birth:</label>
        <input type="date" id="DOB">

        <span>Gender:</span>
        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
        
        <br>
        <label for="select">Country:</label>
        <select name="Occupation" id="select" placeholder="select your Country">
        <option value="1">United States</option>
        <option value="2">Canada</option>
        <option value="3">India</option>
        <option value="4">Other</option>
        </select>
        </fieldset>

        <fieldset>
            <legend>Address</legend>
            <label for="street">Street</label>
            <input type="text" name="Street" id="street">
            <label for="city">City</label>
            <input type="text" name="City" id="city">
            <label for="state">State</label>
            <input type="text" name="State" id="state">
            <label for="zipcode">Zipcode</label>
            <input type="number" name="Zipcode" id="zipcode">
        </fieldset>
        <fieldset>
            <legend>Other Information</legend>
            <label for="Comments">Comments:</label>
    <br>
    <textarea name="Comments" id="Comments" cols="30" rows="10" placeholder="write your comments here"></textarea>
    <button>Register</button>
    <label for="radio1">I agree to the terms and conditions:</label>
    <input type="radio" name="agree" id="radio1">
    <label for="radio1">I don't agree to the terms and conditions:</label>
    <input type="radio" name="agree" id="radio2">
        </fieldset>
        <button>Submit</button>
    </form>
</body>
</html>
