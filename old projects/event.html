<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Event Registration</h1>

    <label for="Name">Name:</label>
    <br>
    <input type="text" id="Name">

    <br>

    <label for="email">Email:</label>
    <br>
    <input type="email" id="email">
    <br>
    <br>
    <label for="phone">Phone:</label>
    <br>
    <input type="tel" id="phone">
    <br>
    <br>
    <label for="select">Occupation:</label>
    <br>
    <select name="Occupation" id="select">
    <option value="1">Engineer</option>
    <option value="2">Doctor</option>
    <option value="3">Lawyer</option>
    <option value="4">Other</option>
    </select>
    <br>
    <br>
    <P>Topics of interest:</P>
    <label for="html">HTML</label>
    <input type="checkbox" id="html">
    <br><br>
    <label for="css">CSS</label>
    <input type="checkbox" id="css">
    <br><br>
    <label for="java">Java Script</label>
    <input type="checkbox" id="java">
    <br><br>
    <label for="Comments">Comments:</label>
    <br>
    <textarea name="Comments" id="Comments" cols="30" rows="10" placeholder="write your comments here"></textarea>
    <button>Register</button>
</body>
</html>
